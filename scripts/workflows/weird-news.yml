# Daily Weird News refresh on main (live site).
name: Update Weird News

on:
  schedule:
    # Daily at 14:00 UTC ≈ 8:00 AM America/Denver (MDT)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines and rebuild page
        run: python3 scripts/fetch_weird_news.py

      - name: Commit and push if changed (main only)
        run: |
          set -e
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "main" ]; then
            echo "Refusing to push from branch: $branch"
            exit 1
          fi
          git config user.name "conspiraparty-bot"
          git config user.email "bot@conspiraparty.com"
          git add data/weird-news.json weird-news.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily weird news refresh"
            git push origin HEAD:main
          fi
